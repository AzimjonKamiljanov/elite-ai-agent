[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-prime"
version = "2.0.0"
description = "JARVIS Prime — unified AI assistant monorepo (elite-ai-agent + Jarvis-x)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AzimjonKamiljanov" }]
keywords = ["ai", "assistant", "jarvis", "llm", "groq", "openrouter", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "openai>=1.30.0",
    "groq>=0.9.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
voice = [
    "vosk>=0.3.45",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]
memory = [
    "chromadb>=0.5.0",
]
pdf = [
    "pymupdf>=1.24.0",
]
perf = [
    "uvloop>=0.19.0",
    "orjson>=3.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
all = [
    "jarvis-prime[voice,memory,pdf,perf,dev]",
]

[project.scripts]
jarvis-prime = "apps.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "voice*", "life*", "tools*", "configs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
